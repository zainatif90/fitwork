# Tests, then builds the production image (website + API, backend/Dockerfile) and stores it in the
# PRIVATE GitHub Container Registry: ghcr.io/zainatif90/fitwork:latest. Render deploys that image.
# The image is only built when every backend and frontend test passes, so broken code cannot be deployed.
name: Build image

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "data/**", ".dockerignore", ".github/workflows/build-image.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", ".github/workflows/build-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:                       # same image as docker-compose (PostgreSQL 16 + pgvector)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fitwork
          POSTGRES_PASSWORD: fitwork_dev_pw
          POSTGRES_DB: fitwork_test
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U fitwork" --health-interval 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://fitwork:fitwork_dev_pw@localhost:5433/fitwork_test
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long   # not a real secret: CI test runs only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Cache the MiniLM model
        uses: actions/cache@v4
        with:
          path: backend/.cache/fastembed
          key: fastembed-minilm-v1
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Backend unit tests (no database)
        working-directory: backend
        run: python -m pytest -m unit -q
      - name: Backend integration tests (PostgreSQL + pgvector + Redis)
        working-directory: backend
        run: python -m pytest -m integration -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend type-check and unit tests
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm test

  build:
    needs: test                       # no image unless all tests pass
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fitwork:latest
            ghcr.io/${{ github.repository_owner }}/fitwork:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
