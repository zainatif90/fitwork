# Builds the production image (website + API, backend/Dockerfile) and stores it in the
# PRIVATE GitHub Container Registry: ghcr.io/zainatif90/fitwork:latest. Render deploys that image.
name: Build image

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "data/**", ".dockerignore", ".github/workflows/build-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fitwork:latest
            ghcr.io/${{ github.repository_owner }}/fitwork:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
