[pytest]
testpaths = tests
# Every test is marked automatically in tests/conftest.py (pytest_collection_modifyitems).
markers =
    unit: pure function tests, no database / Redis / network (run with: pytest -m unit)
    integration: tests through PostgreSQL, Redis or the HTTP API (run with: pytest -m integration)
filterwarnings =
    ignore::DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient`
