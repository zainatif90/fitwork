# Render Blueprint for FitWork (Dashboard -> New -> Blueprint -> pick this repo -> Apply).
# Creates: the API (Docker) + a free Redis-compatible Key Value store for cache / rate limits.
# Render only asks for DATABASE_URL (Neon) and LLM_API_KEY; everything else is filled in here.
# On first start the API loads the seed jobs and the demo accounts by itself (BOOTSTRAP_DATA).
services:
  - type: keyvalue
    name: fitwork-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []          # internal connections only (from the API service)

  - type: web
    name: fitwork-api-zain2026   # -> https://fitwork-api-zain2026.onrender.com (used in frontend/vercel.json)
    runtime: docker
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL        # paste the Neon connection string exactly as Neon shows it
        sync: false
      - key: LLM_API_KEY         # Gemini key (type "none" to skip: proposals then use the template)
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fitwork-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://fitwork-zain2026.vercel.app
      - key: CORS_ORIGINS
        value: https://fitwork-zain2026.vercel.app
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: ENABLE_API_DOCS
        value: "true"
      - key: BOOTSTRAP_DATA
        value: "true"
      - key: DEMO_PASSWORD       # demo personas only (see DEMO.md); the repo is private
        value: Demo-JQhJBMoH4Z7
