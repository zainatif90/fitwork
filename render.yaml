# Render Blueprint for FitWork (Dashboard -> New -> Blueprint -> pick this repo).
# Creates: the API (Docker) + a free Redis-compatible Key Value store for cache / rate limits.
# Secrets are marked sync: false, so Render asks for them in the dashboard; they are never stored in git.
services:
  - type: keyvalue
    name: fitwork-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []          # internal connections only (from the API service)

  - type: web
    name: fitwork-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL        # Neon connection string, postgresql+psycopg://...?sslmode=require
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fitwork-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL        # https://<your-app>.vercel.app (set after the Vercel deploy)
        sync: false
      - key: CORS_ORIGINS        # same as FRONTEND_URL
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_API_KEY
        sync: false
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: ENABLE_API_DOCS
        value: "true"
