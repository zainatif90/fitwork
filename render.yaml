# Render Blueprint for the FitWork API (Dashboard -> New -> Blueprint -> pick this repo).
# Secrets are marked sync: false, so Render asks for them in the dashboard; they are never stored in git.
services:
  - type: web
    name: fitwork-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL        # Neon connection string, postgresql+psycopg://...?sslmode=require
        sync: false
      - key: REDIS_URL           # Upstash, rediss://default:...@...upstash.io:6379
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL        # https://<your-app>.vercel.app
        sync: false
      - key: CORS_ORIGINS        # same as FRONTEND_URL
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_API_KEY
        sync: false
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: ENABLE_API_DOCS
        value: "true"
